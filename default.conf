server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    location = /checkin {
        return 308 /checkin/;
    }

    location /checkin/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /checkin/ {
        try_files $uri $uri/ /checkin/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}
